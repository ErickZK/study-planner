name: study_planner
description: Planejamento de estudos local para Windows e Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.32.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  material_ui: ^1.11.0
  file_picker: ^13.4.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0
  sqlite3: any
flutter:
  uses-material-design: true

msix_config:
  display_name: TJSP Planner
  publisher_display_name: TJSP Planner
  publisher: CN=TJSP Planner Local Widget
  identity_name: br.com.studyplanner
  msix_version: 0.1.2.0
  logo_path: android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
  output_path: build/windows/installer
  output_name: TJSP-Planner
  os_min_version: 10.0.22000.0
  startup_task:
    task_id: TJSPPlannerWidgetStartup
    enabled: true
    parameters: --background
  sign_msix: false
